name: Implementation bug
description: Report a reproducible non-sensitive problem in the public contracts package.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Use the private security advisory link in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision or release
      placeholder: Git commit or release tag
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, tests, or sanitized inputs.
    validations:
      required: true
