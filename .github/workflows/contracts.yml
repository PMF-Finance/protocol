name: Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:export-manifest
      - run: npm run compile
      - run: npm test
      - run: npm run lint
      - run: npm run coverage:check
      - run: npm run check:vault-interface
      - run: npm run check:pmvs-fixtures
