version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # This repository is a generated release mirror. Routine version updates
    # are applied in the authoritative monorepo and arrive in a release export.
    # Dependabot alerts and security updates remain enabled in repository settings.
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
